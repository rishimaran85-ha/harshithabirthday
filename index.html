<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Harshitha | 02.10.2026</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --p-dark: #120521;
            --p-medium: #2d0b4d;
            --p-glow: #a855f7;
            --accent: #f472b6;
        }

        body {
            margin: 0;
            background-color: var(--p-dark);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* Purple Texture with Flowers Overlay */
        .bg-texture {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(18, 5, 33, 0.8), rgba(18, 5, 33, 0.9)),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=2000'); /* Flower texture */
            background-size: cover;
            background-attachment: fixed;
            z-index: -2;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Custom Horizontal Slider */
        .slider-wrapper {
            display: flex;
            width: 1200vw; /* 10 slides + Video + Finale */
            height: 100vh;
            transition: transform 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 3rem;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(30px);
            opacity: 0;
        }

        .active-slide .glass-card {
            transform: translateY(0);
            opacity: 1;
            transition: all 1s ease;
        }

        .slide-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 1.5rem;
            border: 2px solid rgba(168, 85, 247, 0.3);
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            line-height: 1.2;
            background: linear-gradient(to right, #fff, var(--p-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* UI elements */
        .nav-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--p-glow);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 20px var(--p-glow);
        }

        #finale-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, var(--p-medium), var(--p-dark));
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .celebrate-btn {
            background: linear-gradient(45deg, var(--p-glow), var(--accent));
            padding: 1.5rem 4rem;
            border-radius: 999px;
            font-weight: 800;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.5s;
        }

        .celebrate-btn:disabled {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--p-glow);
        }

        @media (max-width: 768px) {
            .glass-card { grid-template-columns: 1fr; padding: 1.5rem; height: 80vh; overflow-y: auto; }
            .slide-img { height: 200px; }
            .quote-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-texture"></div>
    <canvas id="three-canvas"></canvas>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <!-- Intro / Start -->
    <div id="loader" class="fixed inset-0 z-[3000] flex items-center justify-center bg-[#120521]">
        <div class="text-center">
            <h1 class="text-4xl font-bold mb-6 tracking-tighter">OCTOBER 02, 2026</h1>
            <p class="text-purple-400 mb-8 uppercase tracking-[0.5em]">A Special Journey for Harshitha</p>
            <button onclick="initExperience()" class="px-10 py-4 border border-purple-500 rounded-full hover:bg-purple-500/20 transition-all">
                START THE JOURNEY
            </button>
        </div>
    </div>

    <!-- Main Content Slider -->
    <div class="slider-wrapper" id="slider">
        <!-- 10 Slides Generated via JS -->
    </div>

    <!-- Navigation -->
    <div class="nav-btn" id="nextBtn" onclick="nextSlide()">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" viewBox="0 0 256 256"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L200.69,136H40a8,8,0,0,1,0-16H200.69l-62.35-62.34a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
    </div>

    <!-- Finale Overlay -->
    <div id="finale-overlay">
        <h1 id="finalWish" class="opacity-0 translate-y-10 text-6xl md:text-8xl font-black italic mb-6" style="font-family: 'Playfair Display';">
            Happy Birthday<br>Harshitha!
        </h1>
        <p id="finalSub" class="opacity-0 text-xl text-purple-300 tracking-widest uppercase">My Best Friend Forever</p>
    </div>

    <script>
        // --- CONTENT DATA ---
        const slidesData = [
            { img: "h baby p e.jpeg", quote: "To the person who knows me better than I know myself." },
            { img: "H red colour frock p.jpeg", quote: "Life is more beautiful with you by my side, Bestie." },
            { img: "H red F s (2).jpeg", quote: "Side by side or miles apart, you're always in my heart." },
            { img: "Family  Photo (2).jpeg", quote: "Another year of making memories we'll never forget." },
            { img: "H purple saree wit anty stand selfie.jpeg", quote: "You make life better, easier, and a lot more fun just by being in it. Happy Birthday!" },
            { img: "H Full Over front post bombay E.jpeg", quote: "Thank you for being my constant in this changing world." },
            { img: "H birthday 2024 with cake eating E.jpeg", quote: "Your laughter is my favorite soundtrack." },
            { img: "H Hair Ans Smile.jpeg", quote: "You're not just a friend; you're my safe place." },
            { img: "H chat Gpt e b.jpeg", quote: "A birthday wish for the friend who isn't just a part of my life, but a true part of our family. Happy birthday, bestie." },
            { img: "Final image editing for birthday H E.jpeg", quote: "I hope your day is as bright as your soul." }
        ];

        // Generate Slides
        const slider = document.getElementById('slider');
        slidesData.forEach((data, index) => {
            const slide = document.createElement('div');
            slide.className = `slide ${index === 0 ? 'active-slide' : ''}`;
            slide.innerHTML = `
                <div class="glass-card">
                    <img src="${data.img}?auto=format&fit=crop&w=800" class="slide-img" alt="Memory">
                    <div class="flex flex-col justify-center">
                        <p class="text-purple-400 font-bold mb-4 uppercase tracking-widest">Moment ${index + 1}</p>
                        <h2 class="quote-text">"${data.quote}"</h2>
                    </div>
                </div>
            `;
            slider.appendChild(slide);
        });

        // Add Video Slide (30-45 seconds)
        const videoSlide = document.createElement('div');
        videoSlide.className = "slide";
        videoSlide.innerHTML = `
            <div class="flex flex-col items-center max-w-4xl w-full">
                <h2 class="text-3xl font-bold mb-6 text-purple-300">A Message For You</h2>
                <div class="video-container glass-card !block p-2">
                    <video id="birthdayVideo" class="w-full" controls>
                        <source src="H Birthday 2026.mp4" type="video/mp4">
                      Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        `;
        slider.appendChild(videoSlide);

        // Add Final Celebrate Slide
        const finalSlide = document.createElement('div');
        finalSlide.className = "slide";
        finalSlide.innerHTML = `
            <div class="text-center">
                <h2 class="text-5xl font-black mb-12 italic">Are you ready to party?</h2>
                <button id="celebrateBtn" onclick="runFinale()" class="celebrate-btn text-white">CELEBRATE! 🎈</button>
            </div>
        `;
        slider.appendChild(finalSlide);

        // --- NAVIGATION LOGIC ---
        let currentIdx = 0;
        function nextSlide() {
            if (currentIdx < 11) {
                currentIdx++;
                slider.style.transform = `translateX(-${currentIdx * 100}vw)`;
                document.querySelectorAll('.slide').forEach(s => s.classList.remove('active-slide'));
                document.querySelectorAll('.slide')[currentIdx].classList.add('active-slide');
                
                if (currentIdx === 11) document.getElementById('nextBtn').style.display = 'none';
            }
        }

        function initExperience() {
            document.getElementById('bgMusic').play();
            gsap.to("#loader", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('loader').style.display = 'none';
                document.querySelector('.active-slide .glass-card').style.opacity = 1;
            }});
        }

        // --- THREE.JS 3D BACKGROUND ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const group = new THREE.Group();
        scene.add(group);

        const objects = [];
        const createShape = (geometry, color) => {
            const material = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.7, roughness: 0.3 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(Math.random() * 100 - 50, Math.random() * 100 - 50, Math.random() * 100 - 50);
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            group.add(mesh);
            objects.push(mesh);
        };

        const heartGeom = new THREE.TorusKnotGeometry(2, 0.6, 64, 8);
        const flowerGeom = new THREE.IcosahedronGeometry(2, 0);
        const teddyGeom = new THREE.BoxGeometry(2, 3, 2);

        for (let i = 0; i < 20; i++) {
            createShape(heartGeom, 0xd8b4fe);
            createShape(flowerGeom, 0xf472b6);
            createShape(teddyGeom, 0x9333ea);
        }

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light, new THREE.AmbientLight(0x404040));
        camera.position.z = 50;

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += 0.002;
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.position.y += Math.sin(Date.now() * 0.001) * 0.05;
            });
            renderer.render(scene, camera);
        }
        animate();

        // --- FINALE SEQUENCE ---
        function runFinale() {
            const btn = document.getElementById('celebrateBtn');
            btn.disabled = true;

            // Reveal Finale Screen
            const finale = document.getElementById('finale-overlay');
            finale.style.display = 'flex';
            
            gsap.to("#finalWish", { opacity: 1, y: 0, duration: 1.5, delay: 0.5, ease: "power4.out" });
            gsap.to("#finalSub", { opacity: 1, duration: 1, delay: 1.5 });

            // 3D Animation: Swirl out and float up
            objects.forEach((obj, i) => {
                gsap.to(obj.position, {
                    x: obj.position.x * 5,
                    z: obj.position.z * 5,
                    y: 100,
                    duration: 3,
                    ease: "power2.in"
                });
                gsap.to(obj.material, { opacity: 0, duration: 2, delay: 1 });
            });

            // Confetti Logic
            const duration = 10 * 1000;
            const end = Date.now() + duration;

            // 1. Initial Powerful Bursts
            confetti({ particleCount: 150, spread: 70, origin: { x: 0, y: 1 }, colors: ['#7c3aed', '#f472b6'] });
            confetti({ particleCount: 150, spread: 70, origin: { x: 1, y: 1 }, colors: ['#7c3aed', '#f472b6'] });

            // 2. Continuous Shower
            (function frame() {
                // Purple and Emoji Shower
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#a855f7', '#ffffff']
                });
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#a855f7'],
                    shapes: ['emoji'],
                    shapeOptions: { emoji: { value: ['💜', '🎂', '✨', '🧸'] } }
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
